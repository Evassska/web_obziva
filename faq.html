<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FAQ – Obživa</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&display=swap');

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #ffffff;
    }
    .navbar {
      position: fixed;
      top: 0;
      width: 100%;
      box-sizing: border-box;
      background-color: #ffffff;
      color: #000000;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding: 15px 20px;
      gap: 20px;
      z-index: 1000;
      border-bottom: 1px solid #ccc;
    }
    .navbar a {
      color: #000000;
      text-decoration: none;
      font-weight: bold;
    }
    .lang-btn {
      padding: 3px 8px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      border: 1px solid #ccc;
      border-radius: 5px;
      background: transparent;
      color: #666;
      margin-left: 8px;
    }
    .lang-btn:hover {
      border-color: #888;
      color: #000;
    }
    .content {
      max-width: 800px;
      margin: 0 auto;
      padding: 100px 20px 60px;
    }
    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2.4rem;
      margin-bottom: 0.5rem;
    }
    details {
      border-bottom: 1px solid #eee;
      padding: 1rem 0;
    }
    summary {
      font-weight: bold;
      cursor: pointer;
      font-size: 1.05rem;
      list-style: none;
    }
    summary::after {
      content: ' +';
      color: #aaa;
    }
    details[open] summary::after {
      content: ' −';
    }
    details p {
      margin: 0.75rem 0 0;
      line-height: 1.7;
      color: #333;
    }
  </style>
</head>
<body>

  <div class="navbar">
    <a href="index.html" data-i18n="navHome">Domů</a>
    <a href="bylaws.html" data-i18n="navBylaws">Stanovy</a>
    <button class="lang-btn" id="lang-btn" onclick="toggleLang()">EN</button>
  </div>

  <div class="content">
    <h1 data-i18n="title">Často kladené otázky</h1>

    <details>
      <summary data-i18n="q1">Co je Obživa?</summary>
      <p data-i18n="a1">Obživa je spolkový bioobchod zaměřený na potraviny a drogerií.</p>
    </details>

    <details>
      <summary data-i18n="q2">Jak se mohu stát členem?</summary>
      <p data-i18n="a2">Nahraďte tento text informacemi o členství.</p>
    </details>

    <details>
      <summary data-i18n="q3">Kde nás najdete?</summary>
      <p data-i18n="a3">Nahraďte tento text adresou a otevírací dobou.</p>
    </details>
  </div>

  <script>
    const translations = {
      cz: {
        navHome:   'Domů',
        navBylaws: 'Stanovy',
        title: 'Často kladené otázky',
        q1: 'Co je Obživa?',
        a1: 'Obživa je spolkový bioobchod zaměřený na potraviny a drogerií.',
        q2: 'Jak se mohu stát členem?',
        a2: 'Nahraďte tento text informacemi o členství.',
        q3: 'Kde nás najdete?',
        a3: 'Nahraďte tento text adresou a otevírací dobou.',
      },
      en: {
        navHome:   'Home',
        navBylaws: 'Bylaws',
        title: 'Frequently asked questions',
        q1: 'What is Obživa?',
        a1: 'Obživa is a cooperative bio-shop focused on food and drugstore items.',
        q2: 'How can I become a member?',
        a2: 'Replace this text with information about membership.',
        q3: 'Where can you find us?',
        a3: 'Replace this text with the address and opening hours.',
      }
    };

    var currentLang = 'cz';

    function toggleLang() {
      currentLang = currentLang === 'cz' ? 'en' : 'cz';
      const t = translations[currentLang];
      document.querySelectorAll('[data-i18n]').forEach(function(el) {
        const key = el.getAttribute('data-i18n');
        if (t[key]) el.textContent = t[key];
      });
      document.documentElement.lang = currentLang === 'cz' ? 'cs' : 'en';
      document.getElementById('lang-btn').textContent = currentLang === 'cz' ? 'EN' : 'CZ';
    }
  </script>

</body>
</html>
